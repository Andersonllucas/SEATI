<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Bezel Gradients -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b6a85" />
      <stop offset="35%" stop-color="#14556b" />
      <stop offset="70%" stop-color="#0f3f50" />
      <stop offset="100%" stop-color="#092834" />
    </linearGradient>
    <linearGradient id="bezelInnerBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Fingerprint Ridge Gradient -->
    <linearGradient id="ridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Scanner Bracket Gradient -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155e75" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#082f49" flood-opacity="0.35" />
    </filter>
    <filter id="fingerprintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Technical Grid Pattern -->
    <pattern id="techGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.65" />
    </pattern>
  </defs>

  <!-- Outer Rounded Square Bezel Frame -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="url(#bezelGrad)" filter="url(#softShadow)" />
  
  <!-- Outer Bezel Highlight Inset -->
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="url(#bezelInnerBorder)" stroke-width="3" />

  <!-- Inner Display Card -->
  <rect x="36" y="36" width="440" height="440" rx="84" fill="#f8fafc" />

  <!-- Tech Grid Background -->
  <rect x="36" y="36" width="440" height="440" rx="84" fill="url(#techGrid)" />

  <!-- Subtle Radial Glow behind Fingerprint -->
  <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
    <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
  </radialGradient>
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- 4 Viewfinder / Scanner Corner Brackets -->
  <!-- Top-Left Bracket -->
  <path d="M 54 136 L 54 84 A 30 30 0 0 1 84 54 L 136 54" fill="none" stroke="url(#bracketGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top-Right Bracket -->
  <path d="M 376 54 L 428 54 A 30 30 0 0 1 458 84 L 458 136" fill="none" stroke="url(#bracketGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Left Bracket -->
  <path d="M 54 376 L 54 428 A 30 30 0 0 0 84 458 L 136 458" fill="none" stroke="url(#bracketGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Right Bracket -->
  <path d="M 376 458 L 428 458 A 30 30 0 0 0 458 428 L 458 376" fill="none" stroke="url(#bracketGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- BIOMETRIC FINGERPRINT EMBLEM (Center) -->
  <g fill="none" stroke="url(#ridgeGrad)" stroke-linecap="round" stroke-linejoin="round">

    <!-- Central Core Loop 1 (Innermost U-Loop) -->
    <path d="M 248 274 C 248 238 264 238 264 274 L 264 304" stroke-width="11" />
    <circle cx="264" cy="304" r="5" fill="#0284c7" stroke="none" />

    <!-- Core Loop 2 -->
    <path d="M 233 274 C 233 218 279 218 279 274 L 279 336" stroke-width="11" />
    <circle cx="279" cy="336" r="5" fill="#0284c7" stroke="none" />

    <!-- Loop 3 -->
    <path d="M 218 280 C 218 198 294 198 294 280 L 294 366" stroke-width="11" />
    <circle cx="218" cy="280" r="5" fill="#38bdf8" stroke="none" />

    <!-- Loop 4 with Circuit Nodes -->
    <path d="M 203 286 C 203 178 309 178 309 286 L 309 388" stroke-width="11" />
    <circle cx="309" cy="388" r="5.5" fill="#0284c7" stroke="none" />

    <!-- Loop 5 -->
    <path d="M 188 292 C 188 158 324 158 324 292 L 324 354" stroke-width="11" />
    <circle cx="324" cy="354" r="5" fill="#0e7490" stroke="none" />

    <!-- Loop 6 (Outer Broad Whorl) -->
    <path d="M 173 300 C 173 138 339 138 339 300 L 339 328" stroke-width="11" />
    <circle cx="339" cy="328" r="5" fill="#0284c7" stroke="none" />

    <!-- Loop 7 -->
    <path d="M 158 312 C 158 120 354 120 354 312 L 354 340" stroke-width="11" />
    <circle cx="158" cy="312" r="5" fill="#0284c7" stroke="none" />

    <!-- Upper Arch 1 -->
    <path d="M 170 186 C 206 132 306 132 342 186" stroke-width="11" />
    <circle cx="170" cy="186" r="5" fill="#38bdf8" stroke="none" />
    <circle cx="342" cy="186" r="5" fill="#38bdf8" stroke="none" />

    <!-- Upper Arch 2 -->
    <path d="M 190 156 C 224 116 288 116 322 156" stroke-width="10" />

    <!-- Left Flank Ridges with Tech Branching -->
    <path d="M 143 328 C 143 270 148 214 176 168" stroke-width="11" />
    <circle cx="143" cy="328" r="5.5" fill="#0e7490" stroke="none" />

    <path d="M 130 350 C 128 290 134 220 162 170" stroke-width="10.5" />
    <circle cx="130" cy="350" r="5" fill="#0284c7" stroke="none" />

    <path d="M 120 380 C 114 310 120 236 150 184" stroke-width="10" />
    <circle cx="120" cy="380" r="5" fill="#0e7490" stroke="none" />

    <path d="M 138 396 C 132 350 135 304 146 264" stroke-width="10.5" />
    <circle cx="138" cy="396" r="5" fill="#0284c7" stroke="none" />

    <path d="M 160 416 C 152 380 152 340 162 300" stroke-width="10" />
    <circle cx="160" cy="416" r="5" fill="#38bdf8" stroke="none" />

    <!-- Right Flank Ridges with Circuit Traces -->
    <path d="M 368 336 C 368 274 362 216 336 168" stroke-width="11" />
    <circle cx="368" cy="336" r="5.5" fill="#0e7490" stroke="none" />

    <path d="M 382 354 C 384 290 376 220 348 170" stroke-width="10.5" />
    <circle cx="382" cy="354" r="5" fill="#0284c7" stroke="none" />

    <path d="M 394 380 C 398 310 390 236 360 184" stroke-width="10" />
    <circle cx="394" cy="380" r="5" fill="#0e7490" stroke="none" />

    <path d="M 374 398 C 380 352 376 304 364 264" stroke-width="10.5" />
    <circle cx="374" cy="398" r="5" fill="#0284c7" stroke="none" />

    <path d="M 352 418 C 360 380 358 340 348 300" stroke-width="10" />
    <circle cx="352" cy="418" r="5" fill="#38bdf8" stroke="none" />

    <!-- Bottom Center Delta Arches -->
    <path d="M 186 434 C 220 454 292 454 326 434" stroke-width="11" />
    <circle cx="186" cy="434" r="5.5" fill="#0284c7" stroke="none" />
    <circle cx="326" cy="434" r="5.5" fill="#0284c7" stroke="none" />

    <path d="M 210 448 C 236 462 276 462 302 448" stroke-width="10" />

    <path d="M 230 464 C 244 472 268 472 282 464" stroke-width="9" />

    <!-- Micro Circuit Connecting Lines & Nodes -->
    <path d="M 203 336 L 203 372" stroke-width="9" />
    <circle cx="203" cy="336" r="4.5" fill="#38bdf8" stroke="none" />
    <circle cx="203" cy="372" r="4.5" fill="#0284c7" stroke="none" />

    <path d="M 224 350 L 224 394" stroke-width="9" />
    <circle cx="224" cy="350" r="4.5" fill="#38bdf8" stroke="none" />
    <circle cx="224" cy="394" r="4.5" fill="#0284c7" stroke="none" />

    <path d="M 246 364 L 246 414" stroke-width="9" />
    <circle cx="246" cy="364" r="4.5" fill="#38bdf8" stroke="none" />
    <circle cx="246" cy="414" r="4.5" fill="#0284c7" stroke="none" />

    <!-- Circuit Trace Interconnects between lines -->
    <line x1="264" y1="210" x2="264" y2="178" stroke-width="8" stroke-dasharray="3,3" stroke="#0284c7" stroke-opacity="0.8" />
    <circle cx="264" cy="178" r="4" fill="#38bdf8" stroke="none" />

    <line x1="218" y1="230" x2="198" y2="230" stroke-width="7" stroke="#0284c7" stroke-opacity="0.7" />
    <circle cx="198" cy="230" r="3.5" fill="#38bdf8" stroke="none" />

    <line x1="294" y1="230" x2="314" y2="230" stroke-width="7" stroke="#0284c7" stroke-opacity="0.7" />
    <circle cx="314" cy="230" r="3.5" fill="#38bdf8" stroke="none" />
  </g>
</svg>
